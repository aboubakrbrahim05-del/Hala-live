<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tango Live V6 Pro - هدايا و لايف</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system}
body{background:#0a0a12;color:#fff;overflow-x:hidden;user-select:none}
.topbar{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#1a1a2e,#16213e);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{font-weight:900;background:linear-gradient(90deg,#ff00cc,#3333ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:20px}
.coins{background:#1f1f35;border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:6px;border:1px solid #333;font-size:13px}
.page{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:80px}
.hero{padding:12px;display:flex;gap:8px}
.btn-live{flex:1;padding:14px;border:0;border-radius:14px;font-weight:800;color:#fff;cursor:pointer}
.btn-live.live{background:linear-gradient(90deg,#ff0055,#ff5500)}
.btn-live.room{background:linear-gradient(90deg,#6a11cb,#2575fc)}
.grid-lives{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.live-card{background:#1a1a2e;border-radius:16px;overflow:hidden;border:1px solid #2a2a44;cursor:pointer;position:relative}
.live-card .thumb{height:110px;background:linear-gradient(135deg,#2a2a4a,#1a1a2e);display:flex;align-items:center;justify-content:center;font-size:40px}
.live-card .info{padding:8px}
.live-badge{position:absolute;top:6px;left:6px;background:#ff0055;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px}
.viewers{font-size:11px;opacity:.7}
.live-view{display:none;max-width:480px;margin:0 auto;min-height:100vh;background:#000;position:relative;flex-direction:column}
.live-header{padding:10px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent);position:absolute;top:0;left:0;right:0;z-index:5}
.host-big{width:100%;height:58vh;background:radial-gradient(circle at center,#1e1e4a,#0a0a12);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
.host-avatar{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#ff00cc,#3333ff);display:flex;align-items:center;justify-content:center;font-size:50px;border:3px solid #fff;box-shadow:0 0 30px #ff00cc88}
.guests-3x3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;background:#0a0a12}
.guest{aspect-ratio:1;background:#1a1a2e;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #222;cursor:pointer;position:relative;overflow:hidden}
.guest.taken{border-color:#6a11cb;background:#1e1e3a}
.guest .av{width:44px;height:44px;border-radius:50%;background:#2a2a4a;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:4px}
.guest .name{font-size:11px}
.room15{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.seat15{background:#1a1a2e;border-radius:16px;padding:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #2a2a44;cursor:pointer}
.seat15.mine{border-color:#00ff88;box-shadow:0 0 15px #00ff8866}
.seat15.taken{border-color:#ff00aa}
.seat15 .av15{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#6a11cb,#2575fc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin-bottom:6px}
.chat-area{flex:1;background:linear-gradient(180deg,transparent,rgba(0,0,0,.6));padding:6px;max-height:22vh;overflow-y:auto;font-size:13px}
.msg{margin:4px 0;animation:pop .3s}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.gift-anim{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:80px;z-index:100;animation:giftFly 2s forwards;pointer-events:none}
@keyframes giftFly{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}80%{opacity:1}100%{transform:translate(-50%,-150%) scale(.8);opacity:0}}
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#121228;border-top:1px solid #2a2a44;display:flex;justify-content:space-around;padding:8px 0;z-index:20}
.bb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer;opacity:.8}
.bb.active{opacity:1;color:#ff00cc}
.bb .ic{font-size:22px}
.input-bar{display:flex;gap:6px;padding:8px;background:#121228;border-top:1px solid #222;position:sticky;bottom:70px}
.input-bar input{flex:1;background:#1e1e35;border:1px solid #333;border-radius:20px;padding:10px 14px;color:#fff}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:#1e1e35;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn.like{background:linear-gradient(135deg,#ff0055,#ffaa00)}
.gifts-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:#1a1a2e;border-radius:20px 20px 0 0;z-index:30;transition:.35s cubic-bezier(.2,.8,.2,1);max-height:75vh;overflow-y:auto;border:1px solid #333}
.gifts-panel.open{transform:translateX(-50%) translateY(0)}
.gifts-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px}
.gift-item{background:#252540;border-radius:14px;padding:8px 4px;text-align:center;cursor:pointer;border:1px solid #2a2a44;transition:.2s}
.gift-item:active{transform:scale(.9);background:#33335a}
.gift-item .emoji{font-size:28px;display:block;margin-bottom:4px;filter:drop-shadow(0 0 8px #fff5)}
.gift-item .price{font-size:12px;display:flex;align-items:center;justify-content:center;gap:2px}
.gift-item .price b{color:#ffdd00}
.coin-dot{width:12px;height:12px;background:radial-gradient(circle,#ffeb3b,#ff9800);border-radius:50%;display:inline-block;border:1px solid #ff9800}
.tabs{display:flex;gap:6px;padding:8px;overflow-x:auto}
.tab{padding:6px 12px;background:#1e1e35;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer;border:1px solid #333}
.tab.active{background:#6a11cb;color:#fff}
</style>
</head>

    <div class="coins"><span>💰</span><b id="coinBal">10,000</b><span style="font-size:10px">coins</span></div>
  </div>
  <div class="hero">

    <button class="btn-live room" onclick="startRoom()">🎙️ غرفة 15 مايك</button>
  </div>
  <div class="tabs">
    <div class="tab active">🔥 الاستكشاف</div>

    <div class="tab">🎵 شائع</div>
    <div class="tab">💎 VIP</div>

  <div class="grid-lives" id="exploreGrid"></div>
</div>

    <div style="display:flex;gap:6px"><button class="icon-btn" onclick="toggleFollow()" id="followBtn" style="width:auto;padding:0 10px;font-size:12px;background:#ff0055">+ متابعة</button></div>
  </div>
  <div class="host-big" id="hostBig">
    <div class="host-avatar" id="hostAv">B</div>
    <div id="hostName" style="margin-top:8px;font-weight:800">Brahim</div>
    <div style="font-size:11px;opacity:.7">المضيف • Host</div>
  </div>
  <div class="guests-3x3" id="guestsGrid"></div>
  <div class="chat-area" id="liveChat"></div>
  <div class="input-bar">
    <input id="liveInput" placeholder="رسالة...">
    <button class="icon-btn" onclick="openGifts()">🎁</button>
    <button class="icon-btn like" onclick="sendLike()">👍<span id="likeCount" style="font-size:10px;margin-left:2px">0</span></button>
    <button class="icon-btn" onclick="sendLiveMsg()">➤</button>
  </div>
</div>

  <div class="live-header" style="position:relative;background:#121228">
    <button onclick="closeLive
