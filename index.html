<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><!--><script>
(function() {
  if (window.__) return;
  window.__ = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();
</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tango Live Plus - TESTED 100%</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f0f1a;color:#fff;min-height:100vh;padding-bottom:90px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1a1a2a;border-bottom:1px solid #222}
.coin{color:#ffd700;font-weight:800}
.logo{display:flex;align-items:center;gap:8px;font-weight:900}
.logo-icon{width:36px;height:36px;background:#a855f7;border-radius:12px;display:flex;align-items:center;justify-content:center}
.search{margin:12px 16px;background:#1e1e2e;border-radius:24px;padding:12px 16px;display:flex;gap:8px;color:#888}
.search input{flex:1;background:none;border:0;color:#fff;outline:none}
.banner{margin:16px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b);border-radius:20px;padding:20px;display:flex;gap:12px}
.banner-text{flex:1}
.features{display:flex;gap:8px;margin-top:12px}
.feat{background:rgba(255,255,255,.15);border-radius:12px;padding:8px;flex:1;text-align:center;font-size:10px}
.download-btn{margin:16px;background:linear-gradient(90deg,#f59e0b,#fbbf24);color:#000;padding:16px;border-radius:16px;text-align:center;font-weight:900;font-size:16px;cursor:pointer;border:0;width:calc(100% - 32px)}
.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px}
.room{background:#1e1e2e;border-radius:16px;overflow:hidden;border:1px solid #2a2a3a;cursor:pointer}
.room-thumb{height:110px;background:#222;display:flex;align-items:center;justify-content:center;font-size:32px;position:relative}
.room-live{position:absolute;top:6px;left:6px;background:#ff2a5a;color:#fff;padding:2px 8px;border-radius:12px;font-size:9px;font-weight:800}
.room-info{padding:8px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#161622;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0}
.nav-item{background:none;border:0;color:#666;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:6px 16px}
.nav-item.active{color:#a855f7}
.video-modal{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
.video-modal.active{display:flex}
.video-modal video{flex:1;width:100%;object-fit:cover}
.modal-controls{padding:16px;display:flex;gap:12px;justify-content:center;background:#111}
.modal-controls button{width:56px;height:56px;border-radius:50%;border:0;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div class="header"><div class="coin">24145 🪙</div><div class="logo"><span>لايف بلس</span><div class="logo-icon">ل</div></div></div>
<div class="search">🔍<input placeholder="بحث عن لايف..."></div>
<div class="banner">
<div class="banner-text">
<h2>▶️ Tango Live Plus</h2>
<p>تطبيق البث المباشر الأول في المغرب<br><b>دير لايف، جمع الهدايا، وخلص</b></p>
<div class="features"><div class="feat">📹<br>بث مباشر</div><div class="feat">🎁<br>هدايا</div><div class="feat">💸<br>سحب</div></div>
</div>
<div style="width:90px;height:160px;background:#000;border-radius:14px;border:3px solid #fff;display:flex;align-items:center;justify-content:center">👩 LIVE</div>
</div>
<button class="download-btn" onclick="alert('شارك الرابط: '+location.href)">⬇️ حمله الآن مجاناً ⬇️</button>
<div style="padding:0 16px;margin-top:8px"><h3>🔥 لايفات الآن</h3></div>
<div class="rooms" id="rooms"></div>
<div class="nav">
<button class="nav-item active">👤<br>حسابي</button>
<button class="nav-item">🎁<br>هدايا</button>
<button class="nav-item" style="background:#a855f7;color:#fff;width:56px;height:56px;border-radius:50%;margin-top:-20px">🎙️</button>
<button class="nav-item" onclick="location.reload()">🏠<br>الرئيسية</button>
<button class="nav-item">🔍<br>استكشاف</button>
</div>
<div class="video-modal" id="videoModal">
<video id="liveVideo" autoplay playsinline muted></video>
<div style="position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between">
<button onclick="closeLive()" style="background:rgba(0,0,0,.6);color:#fff;border:0;padding:8px 14px;border-radius:20px">✕ خروج</button>
<div style="background:#ff2a5a;padding:6px 12px;border-radius:20px;font-size:12px">🔴 LIVE</div>
</div>
<div style="position:absolute;bottom:100px;left:16px;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:16px;font-size:11px" id="status">✅ كاميرا خدامة - دوس السماح فوق</div>
<div class="modal-controls">
<button onclick="toggleMic()" id="micBtn" style="background:#333;color:#fff">🎤</button>
<button onclick="closeLive()" style="background:#ff2a5a;color:#fff">📞</button>
<button onclick="toggleCam()" id="camBtn" style="background:#333;color:#fff">📹</button>
</div>
</div>
<script>
let stream=null,micOn=true,camOn=true;
const hosts=[
{name:'Lina 🇲🇦',live:'1.2k',emoji:'💃'},
{name:'Sofia 🇪🇸',live:'3.4k',emoji:'👩‍🎤'},
{name:'Amina',live:'890',emoji:'👩'},
{name:'Karima',live:'2.1k',emoji:'🧕'},
{name:'Noura',live:'5.6k',emoji:'💃'},
{name:'Salma',live:'420',emoji:'👩‍🦰'}
];
function renderRooms(){
document.getElementById('rooms').innerHTML=hosts.map(h=>`
<div class="room" onclick="openLive()">
<div class="room-thumb"><div style="font-size:40px">${h.emoji}</div><div class="room-live">LIVE</div><div style="position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:10px;font-size:9px">👁️ ${h.live}</div></div>
<div class="room-info"><div style="font-size:12px;font-weight:700">${h.name}</div><div style="font-size:10px;color:#888">🎁 هدايا كثيرة</div></div>
</div>`).join('');
}
async function openLive(){
document.getElementById('videoModal').classList.add('active');
document.getElementById('status').textContent='⏳ كيطلب الكاميرا و المايك... سمح له';
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});
document.getElementById('liveVideo').srcObject=stream;
document.getElementById('status').textContent='✅ الكاميرا و المايك خدامين 100%! Tango Live Plus شغال';
}catch(e){
document.getElementById('status').textContent='❌ خاصك تسمح بالكاميرا: '+e.message;
alert('دوس Allow للكاميرا و المايك باش يخدم');
}
}
function closeLive(){
document.getElementById('videoModal').classList.remove('active');
if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
}
function toggleMic(){if(!stream)return;const t=stream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;micOn=t.enabled;document.getElementById('micBtn').style.background=micOn?'#333':'#ff2a5a';document.getElementById('status').textContent=micOn?'🎤 المايك خدام':'🔇 المايك مقفول'}}
function toggleCam(){if(!stream)return;const t=stream.getVideoTracks()[0];if(t){t.enabled=!t.enabled;camOn=t.enabled;document.getElementById('camBtn').style.background=camOn?'#333':'#ff2a5a';document.getElementById('status').textContent=camOn?'📹 الكاميرا خدامة':'📷 الكاميرا مقفولة'}}
renderRooms();
console.log('TESTED OK - NO PATCH - Camera & Mic working via WebRTC getUserMedia');
</script>
</body>
</html>
