<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tango Live Plus</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f0f1a;color:#fff;padding-bottom:80px}
.header{display:flex;justify-content:space-between;padding:12px 16px;background:#1a1a2a}
.banner{margin:16px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b);border-radius:20px;padding:20px;text-align:center}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-top:16px}
.room{background:#1e1e2e;border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid #333;text-align:center;padding:12px}
.btn{margin:16px;background:#f59e0b;color:#000;padding:14px;border-radius:14px;text-align:center;font-weight:900;border:0;width:calc(100% - 32px);cursor:pointer;display:block}
#box{position:fixed;inset:0;background:#000;z-index:99;display:none;flex-direction:column}
#box.show{display:flex}
#box video{flex:1;object-fit:cover;width:100%}
</style>
</head>
<body>
<div class="header"><div>🪙 24145</div><div>لايف بلس</div></div>
<div class="banner"><h2>Tango Live Plus</h2><p>تطبيق البث المباشر الأول في المغرب</p></div>
<button class="btn" onclick="openV()">⬇️ افتح لايف الآن ⬇️</button>
<div style="padding:0 16px;margin-top:10px"><h3>🔥 لايفات الآن - دوس على أي وحدة</h3></div>
<div class="rooms">
<div class="room" onclick="openV()"><div style="font-size:40px">💃</div><div>Lina 🇲🇦</div><div style="color:#ff2a5a;font-size:12px">🔴 LIVE - 1.2k</div></div>
<div class="room" onclick="openV()"><div style="font-size:40px">👩‍🎤</div><div>Sofia 🇪🇸</div><div style="color:#ff2a5a;font-size:12px">🔴 LIVE - 3.4k</div></div>
<div class="room" onclick="openV()"><div style="font-size:40px">👩</div><div>Amina</div><div style="color:#ff2a5a;font-size:12px">🔴 LIVE - 890</div></div>
<div class="room" onclick="openV()"><div style="font-size:40px">🧕</div><div>Noura</div><div style="color:#ff2a5a;font-size:12px">🔴 LIVE - 5.6k</div></div>
</div>
<div id="box">
<video id="v" autoplay playsinline muted></video>
<div style="position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between">
<button onclick="closeV()" style="background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px">✕ خروج</button>
<span style="background:#ff2a5a;padding:6px 12px;border-radius:20px;font-size:12px">🔴 LIVE</span>
</div>
<div style="position:absolute;bottom:20px;left:0;right:0;display:flex;gap:10px;justify-content:center">
<button onclick="toggleMic()" style="width:56px;height:56px;border-radius:50%;border:0;background:#333;color:#fff;font-size:20px">🎤</button>
<button onclick="closeV()" style="width:56px;height:56px;border-radius:50%;border:0;background:#ff2a5a;color:#fff;font-size:20px">📞</button>
<button onclick="toggleCam()" style="width:56px;height:56px;border-radius:50%;border:0;background:#333;color:#fff;font-size:20px">📹</button>
</div>
</div>
<script>
let stream=null;
async function openV(){
document.getElementById('box').classList.add('show');
try{
stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
document.getElementById('v').srcObject=stream;
}catch(e){alert('خاصك تسمح بالكاميرا: '+e.message)}
}
function closeV(){document.getElementById('box').classList.remove('show');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function toggleMic(){if(!stream)return;const a=stream.getAudioTracks()[0];if(a)a.enabled=!a.enabled}
function toggleCam(){if(!stream)return;const b=stream.getVideoTracks()[0];if(b)b.enabled=!b.enabled}
</script>
</body>
  </html>
